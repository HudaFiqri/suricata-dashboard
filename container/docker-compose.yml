version: '3.8'

services:
  # PostgreSQL Database
  postgresql:
    image: postgres:15-alpine
    container_name: suricata-postgres
    environment:
      POSTGRES_DB: suricata_dashboard
      POSTGRES_USER: suricata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suricata123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../binary/tools/migrations/postgresql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suricata"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suricata-network

  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: suricata-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: suricata
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ../binary/tools/migrations/mongodb:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/suricata --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suricata-network

  # Suricata Dashboard
  dashboard:
    build:
      context: ..
      dockerfile: container/Dockerfile
    container_name: suricata-dashboard
    environment:
      # Flask
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}

      # PostgreSQL
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_DB: suricata_dashboard
      POSTGRES_USER: suricata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suricata123}

      # MongoDB
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: suricata
      MONGO_USER: ${MONGO_USER:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_EXPIRATION_HOURS: 24

      # Data Retention
      EVENTS_RETENTION_DAYS: 90
      LOGS_RETENTION_DAYS: 30

    ports:
      - "5000:5000"
    depends_on:
      postgresql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ../binary/dashboard:/app/binary/dashboard:ro
      - ../binary/tools:/app/binary/tools:ro
    networks:
      - suricata-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: suricata-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - dashboard
    networks:
      - suricata-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  mongo_config:
    driver: local

networks:
  suricata-network:
    driver: bridge
