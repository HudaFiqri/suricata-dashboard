apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-ingress
  namespace: suricata-monitoring
  annotations:
    # RKE2 uses nginx ingress controller by default
    kubernetes.io/ingress.class: nginx

    # Optional: Enable SSL redirect
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # Optional: Enable rate limiting
    # nginx.ingress.kubernetes.io/limit-rps: "10"

    # Optional: Client body size (for file uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  labels:
    app: suricata-dashboard
spec:
  rules:
  - host: suricata-dashboard.local  # Change this to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard-service
            port:
              number: 5000

  # Optional: TLS configuration
  # Uncomment and configure if using HTTPS
  # tls:
  # - hosts:
  #   - suricata-dashboard.local
  #   secretName: dashboard-tls-secret

  # To create TLS secret:
  # kubectl create secret tls dashboard-tls-secret \
  #   --cert=path/to/cert.crt \
  #   --key=path/to/cert.key \
  #   --namespace=suricata-monitoring
