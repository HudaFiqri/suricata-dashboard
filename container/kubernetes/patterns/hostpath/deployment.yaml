# Pattern 1: HostPath - Single Node with Local Suricata
#
# Use case: Suricata runs on host, dashboard reads logs via hostPath
# Requires: Dashboard pod must run on same node as Suricata
#
# Prerequisites:
# 1. Label the node where Suricata is running:
#    kubectl label nodes <node-name> suricata=enabled
# 2. Ensure Suricata logs exist at /var/log/suricata on the node
# 3. Ensure Suricata config exists at /etc/suricata on the node

apiVersion: apps/v1
kind: Deployment
metadata:
  name: suricata-dashboard
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
    pattern: hostpath
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suricata-dashboard
  template:
    metadata:
      labels:
        app: suricata-dashboard
        pattern: hostpath
    spec:
      # Force pod to run on node with Suricata
      nodeSelector:
        suricata: enabled

      securityContext:
        fsGroup: 1000

      containers:
      - name: dashboard
        image: ghcr.io/yourusername/suricata-dashboard:latest  # Change this!
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http

        envFrom:
        - configMapRef:
            name: dashboard-config

        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dashboard-secrets
              key: DB_PASSWORD

        volumeMounts:
        # Suricata logs from host (read-only)
        - name: suricata-logs
          mountPath: /var/log/suricata
          readOnly: true

        # Suricata config from host (read-only)
        - name: suricata-config
          mountPath: /etc/suricata
          readOnly: true

        # Application data (persistent)
        - name: app-data
          mountPath: /opt/suricata_monitoring/data

        # Application logs (persistent)
        - name: app-logs
          mountPath: /opt/suricata_monitoring/log

        # RRD data (persistent)
        - name: rrd-data
          mountPath: /var/lib/suricata/rrd

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /api/status
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/status
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      # HostPath volumes - direct access to node filesystem
      - name: suricata-logs
        hostPath:
          path: /var/log/suricata
          type: Directory

      - name: suricata-config
        hostPath:
          path: /etc/suricata
          type: Directory

      # Persistent volumes for application data
      - name: app-data
        persistentVolumeClaim:
          claimName: dashboard-data-pvc

      - name: app-logs
        persistentVolumeClaim:
          claimName: dashboard-logs-pvc

      - name: rrd-data
        persistentVolumeClaim:
          claimName: dashboard-rrd-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashboard-data-pvc
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashboard-logs-pvc
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashboard-rrd-pvc
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
