# Pattern 2: DaemonSet - Multi-Node Distributed Monitoring
#
# Use case: Suricata runs on multiple nodes, each node needs its own dashboard
# Requires: Suricata installed on all (or labeled) nodes
#
# Prerequisites:
# 1. Label nodes where Suricata is running:
#    kubectl label nodes <node-name> suricata=enabled
# 2. Ensure Suricata logs exist at /var/log/suricata on each node
# 3. Each dashboard instance monitors its local Suricata

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: suricata-dashboard
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
    pattern: daemonset
spec:
  selector:
    matchLabels:
      app: suricata-dashboard
  template:
    metadata:
      labels:
        app: suricata-dashboard
        pattern: daemonset
    spec:
      # Only run on nodes with Suricata
      nodeSelector:
        suricata: enabled

      # Optional: Tolerate control-plane nodes if needed
      # tolerations:
      # - key: node-role.kubernetes.io/control-plane
      #   operator: Exists
      #   effect: NoSchedule

      securityContext:
        fsGroup: 1000

      # Add node info to pod for identification
      hostNetwork: false
      dnsPolicy: ClusterFirst

      containers:
      - name: dashboard
        image: ghcr.io/yourusername/suricata-dashboard:latest  # Change this!
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP

        envFrom:
        - configMapRef:
            name: dashboard-config

        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dashboard-secrets
              key: DB_PASSWORD

        # Add node name to environment for identification
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        # Customize dashboard name per node
        - name: DASHBOARD_NAME
          value: "Suricata Dashboard - $(NODE_NAME)"

        volumeMounts:
        # Suricata logs from host (read-only)
        - name: suricata-logs
          mountPath: /var/log/suricata
          readOnly: true

        # Suricata config from host (read-only)
        - name: suricata-config
          mountPath: /etc/suricata
          readOnly: true

        # Local storage on node (emptyDir or hostPath)
        - name: app-data
          mountPath: /opt/suricata_monitoring/data

        - name: app-logs
          mountPath: /opt/suricata_monitoring/log

        - name: rrd-data
          mountPath: /var/lib/suricata/rrd

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /api/status
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/status
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      # HostPath volumes - direct access to node filesystem
      - name: suricata-logs
        hostPath:
          path: /var/log/suricata
          type: Directory

      - name: suricata-config
        hostPath:
          path: /etc/suricata
          type: Directory

      # Option 1: Use hostPath for node-local storage
      - name: app-data
        hostPath:
          path: /var/lib/suricata-dashboard/data
          type: DirectoryOrCreate

      - name: app-logs
        hostPath:
          path: /var/lib/suricata-dashboard/logs
          type: DirectoryOrCreate

      - name: rrd-data
        hostPath:
          path: /var/lib/suricata-dashboard/rrd
          type: DirectoryOrCreate

      # Option 2: Use emptyDir (data lost on pod restart)
      # - name: app-data
      #   emptyDir: {}
      # - name: app-logs
      #   emptyDir: {}
      # - name: rrd-data
      #   emptyDir: {}

---
# Service untuk akses individual pods via NodePort
apiVersion: v1
kind: Service
metadata:
  name: dashboard-nodeport
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500  # Akses via <node-ip>:30500
    protocol: TCP
    name: http
  selector:
    app: suricata-dashboard
