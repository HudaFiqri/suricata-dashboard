# Pattern 3: NFS Shared Storage - Scalable Deployment
#
# Use case: Centralized Suricata logs via NFS, dashboard can scale horizontally
# Requires: NFS server with Suricata logs exported
#
# Prerequisites:
# 1. NFS server dengan Suricata logs exported
# 2. NFS client tools installed on all nodes
# 3. Network connectivity dari cluster ke NFS server

apiVersion: apps/v1
kind: Deployment
metadata:
  name: suricata-dashboard
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
    pattern: nfs
spec:
  # Can scale horizontally
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: suricata-dashboard

  template:
    metadata:
      labels:
        app: suricata-dashboard
        pattern: nfs
    spec:
      securityContext:
        fsGroup: 1000

      # Optional: Spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - suricata-dashboard
              topologyKey: kubernetes.io/hostname

      containers:
      - name: dashboard
        image: ghcr.io/yourusername/suricata-dashboard:latest  # Change this!
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http

        envFrom:
        - configMapRef:
            name: dashboard-config

        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dashboard-secrets
              key: DB_PASSWORD

        # Add pod info for identification in multi-replica setup
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name

        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP

        volumeMounts:
        # Suricata logs from NFS (read-only)
        - name: suricata-logs-nfs
          mountPath: /var/log/suricata
          readOnly: true

        # Suricata config from NFS (read-only)
        - name: suricata-config-nfs
          mountPath: /etc/suricata
          readOnly: true

        # Application data (persistent)
        - name: app-data
          mountPath: /opt/suricata_monitoring/data

        # Application logs (persistent)
        - name: app-logs
          mountPath: /opt/suricata_monitoring/log

        # RRD data (persistent, shared across replicas)
        - name: rrd-data
          mountPath: /var/lib/suricata/rrd

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /api/status
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/status
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      # NFS volumes for Suricata files
      - name: suricata-logs-nfs
        nfs:
          server: nfs-server.example.com  # Change to your NFS server
          path: /exports/suricata/logs
          readOnly: true

      - name: suricata-config-nfs
        nfs:
          server: nfs-server.example.com  # Change to your NFS server
          path: /exports/suricata/config
          readOnly: true

      # Persistent volumes for application data
      - name: app-data
        persistentVolumeClaim:
          claimName: dashboard-data-pvc

      - name: app-logs
        persistentVolumeClaim:
          claimName: dashboard-logs-pvc

      # RRD data on NFS (shared across replicas)
      - name: rrd-data
        nfs:
          server: nfs-server.example.com  # Change to your NFS server
          path: /exports/suricata/rrd

---
# PersistentVolumeClaims for application data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashboard-data-pvc
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
spec:
  accessModes:
  - ReadWriteMany  # RWX karena mungkin multiple replicas
  storageClassName: nfs-client  # Use NFS storage class
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashboard-logs-pvc
  namespace: suricata-monitoring
  labels:
    app: suricata-dashboard
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 2Gi
