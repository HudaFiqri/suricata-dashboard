apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: suricata-stack-ingress
  namespace: suricata-monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  labels:
    app: suricata-stack
spec:
  rules:
  - host: suricata.local  # Change this!
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: suricata-stack-service
            port:
              number: 5000
